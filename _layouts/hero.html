<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    {% if page.hero_image %}
    <div class="hero-image-bg"
         style="background-image: url('{{ page.hero_image }}')"
         role="img"
         aria-label="{{ page.hero_image_alt | default: page.title }}">
      <div class="hero-content">
        <h1 class="hero-heading">{{ page.hero_heading | default: page.title }}</h1>
        {% if page.hero_standfirst %}
        <p class="hero-standfirst">{{ page.hero_standfirst }}</p>
        {% endif %}
      </div>
    </div>
    {% endif %}

    <main class="page-content work-page" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
  </body>
</html>
