<header class="site-header" role="banner">
  <div class="header-inner">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <img src="{{ '/assets/images/w_logo.svg' | relative_url }}" alt="{{ site.title }}" height="32">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="page-link{% if page.url == '/writing/' %} active{% endif %}" href="{{ '/writing/' | relative_url }}">Writing</a>
      <a class="page-link{% if page.url == '/work/' %} active{% endif %}" href="{{ '/work/' | relative_url }}">Work</a>
      <a class="page-link{% if page.url == '/now/' %} active{% endif %}" href="{{ '/now/' | relative_url }}">Now</a>
    </nav>
    <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
      <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="0" y1="2" x2="22" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-hidden="true">
    <a class="page-link{% if page.url == '/writing/' %} active{% endif %}" href="{{ '/writing/' | relative_url }}">Writing</a>
    <a class="page-link{% if page.url == '/work/' %} active{% endif %}" href="{{ '/work/' | relative_url }}">Work</a>
    <a class="page-link{% if page.url == '/now/' %} active{% endif %}" href="{{ '/now/' | relative_url }}">Now</a>
  </nav>
</header>
<script>
(function () {
  var header = document.querySelector('.site-header');
  var hamburger = document.querySelector('.nav-hamburger');
  var mobileNav = document.getElementById('mobile-nav');

  window.addEventListener('scroll', function () {
    header.classList.toggle('scrolled', window.scrollY > 20);
  });

  if (hamburger && mobileNav) {
    hamburger.addEventListener('click', function () {
      var isOpen = mobileNav.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', isOpen);
      mobileNav.setAttribute('aria-hidden', !isOpen);
    });
  }
}());
</script>
